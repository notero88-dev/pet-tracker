name: pettrack_app
description: "PetTrack - Pet GPS Tracking for Colombia"
publish_to: 'none'
version: 1.0.1+39

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.10.0
  firebase_auth: ^5.3.4
  firebase_storage: ^12.3.8
  firebase_messaging: ^15.1.7
  cloud_firestore: ^5.6.0
  # Production crash reporting. main.dart wires Flutter framework
  # errors, async errors (runZonedGuarded), platform-dispatcher errors,
  # and isolate errors all into Crashlytics. iOS dSYMs are uploaded
  # automatically by the Firebase Run Script build phase the plugin
  # installs into the Xcode project. See docs/runbooks/app-store-review.md
  # — flips "Datos de errores" to ✅ in the privacy nutrition labels.
  firebase_crashlytics: ^4.3.0

  # OAuth — Sign in with Google + Apple. Both required if any third-party
  # SSO is offered on iOS (App Store rule 4.8). Apple uses the native iOS
  # ASAuthorizationController on iOS; the package falls back to a web
  # flow on Android (requires the Apple Service ID + return URL set up
  # in Apple Developer + Firebase Console — see runbook).
  #
  # Pinned to 6.1.x — newer 6.2.x pulls iOS GoogleSignIn 8.x which
  # transitively wants GTMSessionFetcher 3.x, but Firebase 11.x locks
  # GTMSessionFetcher 4.x → CocoaPods refuses to install. Bump back to
  # ^6.2.x once Firebase updates its bundled SDK to a compatible release.
  google_sign_in: ^6.1.6
  sign_in_with_apple: ^6.1.0
  # crypto needed for the SHA-256 nonce hash that Apple Sign-In requires
  # to bind the OAuth response to this specific sign-in attempt — see
  # auth_provider.signInWithApple().
  crypto: ^3.0.5
  
  # Google Maps
  google_maps_flutter: ^2.10.0
  location: ^7.0.0
  geocoding: ^3.0.0

  # WiFi info — used by the phone-side home-zone setup flow to read
  # the currently-connected SSID + BSSID and send them to the backend
  # instead of asking the MT710 to scan (which fails indoors with
  # marginal coverage). See docs/plans/2026-05-11-phone-side-home-zone.md.
  #
  # iOS: requires `com.apple.developer.networking.HotspotConfiguration`
  # entitlement (set in Runner.entitlements) PLUS location auth (the
  # BSSID is gated behind location for privacy, even with the
  # entitlement). iOS 12+ does not allow scanning nearby networks;
  # only the connected one. Sufficient for our use case.
  network_info_plus: ^6.0.0
  
  # State Management
  provider: ^6.1.2
  
  # HTTP & WebSocket
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  
  # QR Code
  mobile_scanner: ^7.2.0
  
  # Image Picker
  image_picker: ^1.1.2
  
  # UI Components
  cupertino_icons: ^1.0.8
  intl: ^0.20.1
  flutter_svg: ^2.0.14
  # Petti design system — Inter + Space Grotesk
  google_fonts: ^6.2.1
  
  # Utils
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  # UUID v4 for home-setup intent idempotency keys (Phase 1 reconciler).
  uuid: ^4.5.1
  # In-app purchases for the Besti monthly subscription. iOS uses
  # StoreKit; Android uses Google Play Billing. Both surfaced through
  # a single Flutter API. See lib/providers/subscription_provider.dart.
  in_app_purchase: ^3.2.0

  # Amplitude analytics SDK for Flutter (iOS + Android).
  amplitude_flutter: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Generates Android (legacy + adaptive) and iOS launcher icons from
  # assets/icons/besti_icon*.png. Source PNGs are produced by
  # tools/icon-generator/generate_besti_icon.py — see header for rationale.
  # The generator scripts live OUTSIDE assets/icons/ deliberately: Apple's
  # code-signing validator rejects any non-code files dragged into
  # Frameworks/App.framework/flutter_assets/ that aren't individually
  # signed (a .py in assets/icons/ failed App Store validation on
  # 2026-05-15 with "Code object is not signed at all"). Keeping all
  # tooling out of assets/ prevents this entire class of issue.
  # Re-run with: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "ic_launcher"  # writes to android/app/src/main/res/mipmap-*/
  ios: true               # writes to ios/Runner/Assets.xcassets/AppIcon.appiconset/
  image_path: "assets/icons/besti_icon.png"
  remove_alpha_ios: true  # iOS rejects alpha channels in app icons
  # Adaptive (Android 8+) — orange paw foreground over cream background,
  # matching the iOS icon (cream + orange paw). Switched from Marigold
  # bg to Cream as part of the Petti → Besti rebrand 2026-05-06.
  adaptive_icon_background: "#FAF7F2"
  adaptive_icon_foreground: "assets/icons/besti_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/illustrations/
